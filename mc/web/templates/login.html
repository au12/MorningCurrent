{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h2>Sign in</h2>
  {% if error %}<p class="flash bad">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" name="password" autocomplete="current-password" autofocus required>
    <p class="hint">Set with the <span class="mono">ADMIN_PASSWORD</span> variable. If you didn't set one, a generated
      password is in the container log and in <span class="mono">secrets.json</span> in the data folder.</p>
    <div class="actions"><button type="submit">Sign in</button></div>
  </form>
</div>
{% endblock %}
