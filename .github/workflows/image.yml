name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "mc/**"
      - "docker/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "mc/**"
      - "docker/**"
      - "Dockerfile"
      - "requirements.txt"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version to tag the image with (set by the Release workflow)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/morning-current

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ (inputs.version || '') == '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
            type=raw,value=${{ inputs.version }},enable=${{ (inputs.version || '') != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=The Morning Current
            org.opencontainers.image.description=A printed morning newspaper, made nightly from RSS feeds

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
